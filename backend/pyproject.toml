[project]
name = "voice-core"
version = "0.1.0"
description = "Portable multilingual voice assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-genai>=2.23.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
    "asyncpg>=0.31.0",
    "openai>=3.17.0",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "bandit>=1.7",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
    "httpx2>=2.13.0",
    "websockets>=16.1",
    "miniaudio>=1.71",
    "py-spy>=0.4.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: hits real provider APIs; needs .env and network",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["voice_core"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_core", "app"]
