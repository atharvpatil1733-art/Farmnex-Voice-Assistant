# Domain pack: farm marketplace (SIH 2026 prototype)
id: farm_marketplace
app_name: "BhumiBij"          # rename freely; used in persona and knowledge
pack_version: 0.1.0
languages: [hi-IN, mr-IN, en-IN]
default_language: hi-IN
timezone: Asia/Kolkata

voice:
  tts_speaker: "<audition female bulbul:v3 voices and set one>"
  speech_pace: 0.95           # slightly slower for clarity

persona_file: persona.md
tools_file: tools.yaml
workflows_dir: workflows
knowledge_dir: knowledge
fixtures_dir: fixtures

fillers:                       # spoken once if a tool takes > 1.2 s
  hi-IN: "एक सेकंड, देख रही हूँ।"
  mr-IN: "एक सेकंद, बघते."
  en-IN: "One moment, let me check."

stt_context:                   # vocabulary hints if the STT provider supports them
  - प्री-बिडिंग
  - क्रॉप रेस्क्यू
  - पिकअप
  - बोली
  - क्विंटल

confirmation_lexicon_extra:
  yes: ["हो करा", "चालेल", "हाँ जी", "कर दो"]
  no: ["नको", "राहू द्या", "रहने दो"]

client_actions:                # allowlist; host app must implement each
  - navigate
  - open_photo_picker
  - refresh

evals:
  golden: evals/golden.jsonl
  retrieval: evals/retrieval.jsonl
  redteam: evals/redteam.jsonl

speech_units:                  # how the voice reads units (core normalizer applies these)
  - aliases: [kg, kgs, kilo, kilos]
    hi-IN: किलो
    mr-IN: किलो
    en-IN: [kilo, kilos]
  - aliases: [qtl, qtls, quintal, quintals]
    hi-IN: क्विंटल
    mr-IN: क्विंटल
    en-IN: [quintal, quintals]
  - aliases: [ton, tons, tonne, tonnes]
    hi-IN: टन
    mr-IN: टन
    en-IN: [tonne, tonnes]

answer_labels:                 # value -> spoken word, used by tools.yaml answer_template {x|set}
  crops:
    hi-IN: {onion: प्याज़, tomato: टमाटर, soybean: सोयाबीन, pomegranate: अनार}
    mr-IN: {onion: कांदा, tomato: टोमॅटो, soybean: सोयाबीन, pomegranate: डाळिंब}
    en-IN: {onion: onions, tomato: tomatoes, soybean: soybean, pomegranate: pomegranates}
  payment:
    hi-IN: {processing: अभी प्रक्रिया में है, pending: अभी बाकी है}
    mr-IN: {processing: प्रक्रियेत आहे, pending: अजून बाकी आहे}
    en-IN: {processing: is being processed, pending: is still pending}
